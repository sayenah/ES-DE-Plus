<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">ES-DE Plus</title>
  <desc id="desc">An open-source Android home for your game collection. Banner with a stylised controller and pixel stars.</desc>
  <!-- SPDX-License-Identifier: MIT. Written for ES-DE-Plus; contains no upstream or third-party artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120f2e"/>
      <stop offset="0.55" stop-color="#2a1f5c"/>
      <stop offset="1" stop-color="#0d2b3a"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.82" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#ff4d9d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#2ee6c5" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff6fa8"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3474"/>
      <stop offset="1" stop-color="#231d4d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glowPink)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glowTeal)"/>

  <!-- pixel stars -->
  <g opacity="0.9">
    <rect x="96" y="52" width="8" height="8" fill="#ffd166"/>
    <rect x="420" y="40" width="6" height="6" fill="#8b7bff"/>
    <rect x="1080" y="300" width="8" height="8" fill="#2ee6c5"/>
    <rect x="1124" y="72" width="6" height="6" fill="#ffd166"/>
    <rect x="560" y="330" width="6" height="6" fill="#ff6fa8"/>
    <rect x="980" y="38" width="10" height="10" fill="#ff6fa8"/>
    <rect x="70" y="300" width="6" height="6" fill="#8b7bff"/>
    <rect x="300" y="336" width="8" height="8" fill="#2ee6c5"/>
    <path d="M1040 150h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#ffd166" opacity="0.8"/>
    <path d="M150 110h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#2ee6c5" opacity="0.8"/>
  </g>

  <!-- controller -->
  <g transform="translate(96 118) scale(0.92)">
    <path d="M40 10h200c38 0 62 34 66 80l6 64c3 34-30 52-54 30l-36-34H76l-36 34c-24 22-57 4-54-30l6-64C-4 44 2 10 40 10z"
          fill="url(#pad)" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="3"/>
    <!-- d-pad -->
    <g fill="#e9e6ff">
      <rect x="54" y="62" width="20" height="58" rx="4"/>
      <rect x="35" y="81" width="58" height="20" rx="4"/>
    </g>
    <!-- buttons -->
    <circle cx="232" cy="68" r="12" fill="#ffd166"/>
    <circle cx="256" cy="91" r="12" fill="#ff6fa8"/>
    <circle cx="208" cy="91" r="12" fill="#2ee6c5"/>
    <circle cx="232" cy="114" r="12" fill="#8b7bff"/>
    <!-- start / select -->
    <rect x="124" y="74" width="24" height="9" rx="4.5" fill="#e9e6ff" opacity="0.75"/>
    <rect x="156" y="74" width="24" height="9" rx="4.5" fill="#e9e6ff" opacity="0.75"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="462" y="176" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-1">ES-DE <tspan fill="url(#plus)">Plus</tspan></text>
    <text x="466" y="226" font-size="24" font-weight="500" fill="#d9d4ff">An open-source Android home for your game collection</text>
    <text x="466" y="272" font-size="17" font-weight="600" fill="#2ee6c5" letter-spacing="2">CLEAN ROOM  ·  CONTROLLER FIRST  ·  BUILT IN THE OPEN</text>
  </g>
</svg>
