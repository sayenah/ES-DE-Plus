name: Bootstrap ES-DE Plus

on:
  push:
    paths:
      - ".github/workflows/bootstrap-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'sayenah/ES-DE-Plus'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import official ES-DE 3.5.0 history
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-upstream.yml /tmp/bootstrap-upstream.yml
          git remote add upstream https://gitlab.com/es-de/emulationstation-de.git
          git fetch --force upstream refs/tags/v3.5.0:refs/tags/v3.5.0
          git checkout -B imported refs/tags/v3.5.0
          mkdir -p .github/workflows
          cp /tmp/bootstrap-upstream.yml .github/workflows/bootstrap-upstream.yml
          git config user.name "ES-DE-Plus Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/bootstrap-upstream.yml
          git commit -m "Initialize ES-DE-Plus from official ES-DE v3.5.0"
          git push origin HEAD:refs/heads/main --force
          git tag -f upstream-v3.5.0 refs/tags/v3.5.0
          git push origin refs/tags/upstream-v3.5.0 --force
