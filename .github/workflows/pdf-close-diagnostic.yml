# SPDX-License-Identifier: MIT
# ES-DE-Plus — written for ES-DE-Plus. WO-16 diagnostic evidence only; no APK upload.
name: Diagnose PDF close
on:
  push:
    branches: [fix/pdf-close-after-resume]
  workflow_dispatch:
    inputs:
      cycles:
        description: Cached-60-page pause / resume / single-key close cycles (1..20)
        type: string
        default: "20"
permissions:
  contents: read
jobs:
  pdf-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      GRADLE_USER_HOME: ${{ github.workspace }}/android/.deps/gradle-user-home
      ESDE_PDF_CLOSE_DIAGNOSTIC_CYCLES: ${{ inputs.cycles || '20' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext nasm yasm ninja-build meson pkg-config autoconf automake libtool
      - name: Ensure pinned SDK tools before offline Gradle configuration
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.5'
          test -f "$ANDROID_NDK_HOME/source.properties"
          grep -Fx 'Pkg.Revision = 28.2.13676358' "$ANDROID_NDK_HOME/source.properties"
          echo "$ANDROID_HOME/cmake/3.31.5/bin" >> "$GITHUB_PATH"
      - name: Restore downloads
        if: ${{ success() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/.deps/downloads
          key: android-downloads-${{ hashFiles('tools/Android_dependencies_setup.sh', 'android/distribution.py') }}
      - name: Verify cached pinned Debian font sources, table binding and positive controls
        run: |
          set -o pipefail
          mkdir -p android/evidence
          python3 android/distribution.py font | tee android/evidence/distribution-freefont.txt
          python3 android/distribution.py font-fallback-controls | tee android/evidence/distribution-font-fallback-controls.txt
      - name: Prepare source and include layout
        run: |
          set -o pipefail
          tools/Android_dependencies_setup.sh 2>&1 | tee android/source-archives.log
      - name: Record dependency cache key
        id: dependency-cache
        env:
          KEY: android-ndk28.2.13676358-api29-${{ hashFiles('tools/Android_dependencies_*.sh', 'android/package-dependencies.py', 'android/license-inputs.py', 'android/license-tool.py') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Restore per-ABI dependencies
        id: deps
        if: ${{ success() }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            android/.deps/install
            android/libs
          key: ${{ steps.dependency-cache.outputs.key }}
      - name: Build both dependency ABIs
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          export JOBS=$(nproc)
          echo "Dependency build parallelism: $JOBS"
          tools/Android_dependencies_build.sh arm64-v8a 2>&1 | tee android/deps-arm64.log
          tools/Android_dependencies_build.sh x86_64 2>&1 | tee android/deps-x86_64.log
      - name: Save completed dependency installs
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            android/.deps/install
            android/libs
          key: ${{ steps.dependency-cache.outputs.key }}
      - name: Restore ABI-neutral generated headers
        run: tools/Android_dependencies_setup.sh
      - name: Assemble debug APK with committed wrapper
        id: assemble
        run: |
          set -o pipefail
          cd android
          ./gradlew --no-daemon ${GRADLE_NETWORK_ARGS:-} assembleDebug 2>&1 | tee assemble.log
      - name: Enable KVM access
        if: ${{ success() }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate PDF fixtures
        run: python3 android/pdf-fixtures.py android/evidence/pdf-fixtures
      - name: API 34 cached-manual resume diagnostics
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: esde-pdf-close
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          sdcard-path-or-size: 512M
          disable-animations: true
          cores: 4
          ram-size: 4096M
          script: |
            python3 android/smoke_support.py boot
            adb push android/evidence/pdf-fixtures/. /data/local/tmp/esde-pdf-fixtures/
            python3 android/smoke_session.py pdf-direct -- python3 android/smoke.py android/app/build/outputs/apk/debug/app-debug.apk --phase pdf-direct
      - name: Upload live diagnostic evidence (no APK)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-close-api34-attempt${{ github.run_attempt }}
          path: |
            android/evidence/**/*.txt
            android/evidence/**/*.png
            android/*.log
          retention-days: 7
