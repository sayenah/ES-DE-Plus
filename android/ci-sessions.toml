# SPDX-License-Identifier: MIT
# ES-DE-Plus — written for ES-DE-Plus. Additive PR path → fresh-session map (WO-21).
# Every PR starts with api33/core. All matching rules add sessions; no rule subtracts.
# fnmatch globs are repository-relative; * also matches directory separators.
# Rules add API 33 sessions; android15 adds API 35 core and touch where selected.
# API 35 gating follows ci_selection.API35_GATING.

[[rule]]
paths = ["android/app/src/main/*.kt", "android/app/src/main/*.java", "android/app/src/main/AndroidManifest.xml", "android/app/src/main/res/values/*.xml"]
sessions = ["lifecycle", "assets", "app-data", "clear-task", "manager-direct", "manager-scoped"]
android15 = true
reason = "Host lifecycle, configuration, entry and restart paths; debug/minified destruction and forced asset relaunch"

[[rule]]
paths = ["*Pdf*", "*PDF*", "*pdf*", "android/app/src/debug/*/RuntimeSmoke.kt", "android/app/src/main/*/bridge/StorageModel.kt", "android/app/src/main/*/bridge/Rom*.kt"]
sessions = ["pdf-direct", "pdf-scoped"]
reason = "PDF renderer/viewer/close contracts, fixtures and storage/recipient transports in both modes"

[[rule]]
paths = ["android/app/src/main/AndroidManifest.xml", "android/network*", "android/update_smoke.py", "android/test_signing.py", "android/app/src/main/*Network*", "android/app/src/main/*Update*", "es-app/src/*/GuiThemeDownloader*", "es-app/src/*/GuiScraper*", "es-app/src/*ApplicationUpdater*", "es-app/src/scrapers/*", "es-core/src/*HttpReq*", "resources/certificates/*"]
sessions = ["integration"]
reason = "Update/signature continuity and live HTTPS themes/scraper"

[[rule]]
paths = ["android/lifecycle_smoke.py", "android/app/src/debug/*/StartupProbeActivity.kt", "android/stub-emulator/*/LifecycleProbe.kt"]
sessions = ["lifecycle"]
reason = "Lifecycle debug/minified stalls, destruction and restart probes"

[[rule]]
paths = [".github/workflows/forced-relaunch.yml", "android/forced_relaunch_smoke.py", "android/predictive_back_smoke.py", "android/forced-relaunch-overlay/*", "android/app/src/debug/*/ForcedRelaunchActivity.kt", "android/app/src/debug/res/*", "android/stub-emulator/*/ForcedRelaunchProbe.kt", "android/stub-emulator/*/PredictiveBackActivity.kt"]
sessions = ["assets"]
reason = "Forced ASSETS_PATHS recreation and preview/cancel/committed return probes"

[[rule]]
paths = ["android/predictive_back_smoke.py", "android/stub-emulator/*/PredictiveBackActivity.kt"]
sessions = ["assets"]
android15 = true
reason = "Android 15 platform launch-behind and predictive-back compatibility"

[[rule]]
paths = ["es-core/src/utils/PlatformUtilAndroid.*", "android/app/src/main/*/NativeBridge.kt", "android/app/src/main/*/bridge/StorageModel.kt", "android/app/src/main/AndroidManifest.xml", "android/stub-emulator/*/RecipientActivity.kt", "android/smoke.py", "android/SmokeMenuFocus.java", "android/app/src/debug/*/RuntimeSmoke.kt", "android/launch_checks.py", "android/smoke_checks.py", "android/importer_navigation.py", "android/smoke_session.py", "android/smoke_phases.py", "android/smoke_support.py", "android/session_logcat.py", "android/fresh_session_checks.py", "android/install_settle.py", "android/stub-emulator/src/main/AndroidManifest.xml", "android/app/src/debug/AndroidManifest.xml"]
sessions = ["core", "lifecycle", "integration", "pdf-direct", "pdf-scoped", "assets", "app-data", "clear-task", "manager-direct", "manager-scoped", "touch"]
android15 = true
reason = "Shared runtime harness, fresh guest/logcat/settle, recipient/configuration grants or shared component declarations used by every session"

[[rule]]
paths = ["android/app/src/main/res/drawable/tv_*", "android/icon_smoke.py"]
sessions = ["core"]
reason = "Leanback banner and stock TV launcher icon/entry observations"

# Workflow/selector/build/audit changes alone use the mandatory core baseline.
# They still execute every pre-emulator control; changes to session code match above.

[[rule]]
paths = ["android/clear_task_smoke.py", "android/stub-emulator/*/ClearTaskProbe.kt", "android/app/src/debug/res/anim/clear_task_probe_hold.xml", "android/app/src/debug/res/values/clear_task_probe.xml"]
sessions = ["clear-task"]
reason = "Clear-task entry redirects, native return/join/retirement and one-new-main chains"

[[rule]]
paths = ["android/audio_smoke.py", "es-core/src/AudioManager.*", "tests/audio-deinit/*"]
sessions = ["integration"]
reason = "Audio teardown, window reload and launch regression exercised by integration"

[[rule]]
paths = ["android/app_data_smoke.py", "android/app/src/main/*/bridge/AdoptedSettings.kt", "android/app/src/main/*/bridge/StorageModel.kt", "android/app/src/debug/*/AppDataSmoke.kt"]
sessions = ["app-data"]
reason = "Application-data consent, adoption, root recovery and retained data"

[[rule]]
paths = [".github/workflows/build-android.yml", "android/ci_apks.py", "android/ci_apks_test.py"]
sessions = ["core", "lifecycle", "integration", "pdf-direct", "pdf-scoped", "assets", "app-data", "clear-task", "manager-direct", "manager-scoped", "touch"]
android15 = true
reason = "Shared parallel build, APK transfer and session invocation affect every job"

[[rule]]
paths = ["android/network_smoke.py", "android/network_navigation.py", "android/theme_trust_smoke.py", "android/theme-owner-control.py", "android/app/src/debug/*/ThemeTrustSmoke.kt", "es-app/src/guis/ThemeRepositoryTrust*"]
sessions = ["integration", "pdf-scoped"]
reason = "Shared downloader/trust controls run in direct integration and scoped-PDF sessions"

[[rule]]
paths = ["android/emulator_manager_smoke.py", "android/emulator-manager-probe.cpp", "android/app/src/debug/*/EmulatorManagerSmoke.kt", "android/app/src/debug/*/LaunchSmoke.kt", "android/app/src/main/*/bridge/AppDiscovery.kt", "android/handler-stub/*", "es-app/src/EmulatorManager*", "es-app/src/EmulatorLaunchProfile*", "es-app/src/guis/GuiEmulatorManager*", "es-app/src/FileData.*", "es-app/src/SystemData.*", "es-app/src/views/ViewController.*"]
sessions = ["manager-direct", "manager-scoped"]
reason = "Manager discovery, profile persistence, direct and scoped/minified native GUI contracts"

[[rule]]
paths = ["es-core/src/InputOverlay*", "es-core/src/TouchOverlayReset.h", "tests/input_overlay/*", "android/touch*.py", "android/search_entry_smoke.py", "android/app/src/debug/*/SearchEntrySmokeFixtures.kt", "es-app/src/guis/SearchEntry.*", "es-app/src/views/GamelistBase.*", "es-app/src/guis/GuiGamelistOptions.*", "android/app/src/debug/*/TouchSmoke.kt", "resources/graphics/overlay/*", "es-core/src/InputManager.*", "es-core/src/InputConfig.*", "es-app/src/EmulatorManagerTouch.*", "es-core/src/Window.*", "es-core/src/renderers/Renderer.*", "es-core/src/GuiComponent.h", "es-core/src/guis/GuiDetectDevice.*", "es-app/src/main.cpp", "es-app/src/guis/GuiMenu.*", "android/app/src/main/*/ConfiguratorSession.kt", "android/app/src/main/*/ConfiguratorActivity.kt"]
sessions = ["touch"]
android15 = true
reason = "Overlay layout, transitions, ownership, rendering and Android multi-pointer assertions"

[[rule]]
paths = ["es-app/src/guis/GuiSearch.*", "es-app/src/search/*", "tests/search-screen/*", "android/search_screen_smoke.py", "android/search-input-probe.cpp"]
sessions = ["touch"]
android15 = true
reason = "Full-screen search controller, IME, direct touch and live-query timing"
