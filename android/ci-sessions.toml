# ES-DE-Plus — written for ES-DE-Plus. Additive PR path → fresh-session map (WO-21).
# Every PR starts with api33/core. All matching rules add sessions; no rule subtracts.
# fnmatch globs are repository-relative; * also matches directory separators.
# Images default to api33. Explicit extra images apply only to that rule's sessions.

[[rule]]
paths = ["android/app/src/main/*.kt", "android/app/src/main/*.java", "android/app/src/main/AndroidManifest.xml", "android/app/src/main/res/values/*.xml"]
sessions = ["lifecycle", "assets"]
reason = "Host lifecycle, configuration, entry and restart paths; debug/minified destruction and forced asset relaunch"

[[rule]]
paths = ["*Pdf*", "*PDF*", "android/pdf_*", "android/app/src/main/*/bridge/StorageModel.kt", "android/app/src/main/*/bridge/Rom*.kt"]
sessions = ["pdf-direct", "pdf-scoped"]
reason = "PDF renderer/viewer/close contracts, fixtures and storage/recipient transports in both modes"

[[rule]]
paths = ["android/network*", "android/update_smoke.py", "android/test_signing.py", "android/app/src/main/*Network*", "android/app/src/main/*Update*", "es-app/src/*/GuiThemeDownloader*", "es-app/src/*/GuiScraper*", "es-app/src/*ApplicationUpdater*", "es-app/src/scrapers/*", "es-core/src/*HttpReq*", "resources/certificates/*"]
sessions = ["integration"]
images = ["api33", "api34"]
reason = "Update/signature continuity and live HTTPS themes/scraper; API 34 owns gating remote/negative controls"

[[rule]]
paths = ["android/lifecycle_smoke.py", "android/app/src/debug/*/StartupProbeActivity.kt", "android/stub-emulator/*/LifecycleProbe.kt"]
sessions = ["lifecycle"]
reason = "Lifecycle debug/minified stalls, destruction and restart probes"

[[rule]]
paths = ["android/forced_relaunch_smoke.py", "android/predictive_back_smoke.py", "android/asset-overlay/*", "android/app/src/debug/*/ForcedRelaunchActivity.kt", "android/app/src/debug/res/*", "android/stub-emulator/*/ForcedRelaunchProbe.kt", "android/stub-emulator/*/PredictiveBackActivity.kt"]
sessions = ["assets"]
reason = "Forced ASSETS_PATHS recreation and preview/cancel/committed return probes"

[[rule]]
paths = ["android/predictive_back_smoke.py", "android/stub-emulator/*/PredictiveBackActivity.kt"]
sessions = ["assets"]
images = ["api34"]
reason = "API 34 has a distinct platform launch-behind evidence contract"

[[rule]]
paths = ["android/smoke.py", "android/smoke_session.py", "android/smoke_phases.py", "android/smoke_support.py", "android/session_logcat.py", "android/fresh_session_checks.py", "android/install_settle.py", "android/stub-emulator/src/main/AndroidManifest.xml", "android/app/src/debug/AndroidManifest.xml"]
sessions = ["core", "lifecycle", "integration", "pdf-direct", "pdf-scoped", "assets"]
reason = "Shared runtime harness, fresh guest/logcat/settle or shared probe declarations used by every session"

[[rule]]
paths = ["android/app/src/main/res/drawable/tv_*", "android/icon_smoke.py"]
sessions = ["core"]
images = ["tv36"]
reason = "Leanback banner and stock TV launcher icon/entry observations"

# Workflow/selector/build/audit changes alone use the mandatory core baseline.
# They still execute every pre-emulator control; changes to session code match above.
